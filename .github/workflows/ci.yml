name: FitMyStyle quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: node --test source/tests/*.test.mjs
      - name: Test FamilyLook measurements
        run: node --test familylook/tests/*.test.mjs
      - name: Build modular static package
        run: node source/scripts/build.mjs
      - name: Verify publish output
        run: test -s source/dist/index.html
  next-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familylook/next-app
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: familylook/next-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  private-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familylook/fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
